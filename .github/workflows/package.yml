name: Package MyTV Calendar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-v6-393.js'
      - 'app-v6-393.css'
      - 'manifest.webmanifest'
      - 'build-version.txt'
      - '.github/workflows/package.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current release package
        run: |
          mkdir -p package
          cp index.html mytv-current.html app-v6-393.css app-v6-393.js manifest.webmanifest build-version.txt package/
          cp -R push package/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: MyTV-Calendar-Current
          path: package/

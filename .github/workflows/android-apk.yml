name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Validate APK before distribution
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 12
      - uses: actions/upload-artifact@v4
        with:
          name: MyTVCalendar-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct APK download
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/MyTVCalendar-V6.4.97.apk
          git fetch origin main
          git reset --hard origin/main
          mkdir -p downloads
          cp /tmp/MyTVCalendar-V6.4.97.apk downloads/MyTVCalendar-V6.4.97.apk
          git add downloads/MyTVCalendar-V6.4.97.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish direct Android APK V6.4.97"
            git push origin HEAD:main
          fi

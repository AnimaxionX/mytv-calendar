<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2596ff"><title>MyTV Calendar Mobile Beta</title><style>
:root{--b:#2596ff;--sky:#eaf6ff;--o:#ff7a45;--p:#7b61ff;--g:#22c58b;--y:#ffd84d;--ink:#17223b;--m:#66738d;--line:#dcebfa;--bg:#f7fbff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;padding-bottom:92px}.top{position:sticky;top:0;z-index:4;background:#fff;padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.brand span{color:var(--b)}.live{font-size:11px;background:#e8fff7;color:#087b55;padding:7px 9px;border-radius:99px;font-weight:800}.page{padding:20px 16px}.hero{background:linear-gradient(135deg,var(--b),var(--p));color:white;border-radius:24px;padding:24px}.hero h1{margin:0 0 8px;font-size:29px}.hero p{margin:0;opacity:.9;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{border:1px solid var(--line);border-radius:17px;padding:13px;text-align:center}.stat b{display:block;font-size:20px;color:var(--b)}h2{font-size:19px;margin:24px 2px 12px}.card{border:1px solid var(--line);border-radius:19px;padding:15px;margin:10px 0;background:#fff;box-shadow:0 5px 18px #2596ff0d}.row{display:flex;gap:13px;align-items:center}.poster{width:62px;height:86px;border-radius:12px;background:linear-gradient(145deg,var(--sky),#ddd);display:grid;place-items:center;font-size:26px;flex:none}.meta{flex:1;min-width:0}.title{font-weight:850;font-size:17px}.sub{color:var(--m);margin-top:5px;line-height:1.35}.tag{display:inline-block;margin-top:7px;background:var(--sky);color:#1675ca;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800}.btn{border:0;background:var(--b);color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}.btn.alt{background:var(--sky);color:#176fb9}.search{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;outline:none}.notice{background:#fff8e4;border:1px solid #ffe49a;border-radius:15px;padding:12px;color:#765b0c;line-height:1.4;margin:12px 0}.empty{text-align:center;padding:45px 18px;color:var(--m)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 4px max(7px,env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:transparent;color:var(--m);padding:7px 2px;font-size:10px;font-weight:750}.nav i{font-style:normal;display:block;font-size:20px;margin-bottom:2px}.nav.on{color:var(--b)}.hidden{display:none}.sectionTitle{display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:var(--m)}
</style></head><body><div class="app"><header class="top"><div class="brand"><span>MyTV</span> Calendar</div><div class="live">● MOBILE BETA</div></header><main id="content"></main></div>
<nav class="bottom"><button class="nav on" data-p="home"><i>⌂</i>Home</button><button class="nav" data-p="discover"><i>⌕</i>Discover</button><button class="nav" data-p="shows"><i>♥</i>My Shows</button><button class="nav" data-p="calendar"><i>▣</i>Calendar</button><button class="nav" data-p="more"><i>•••</i>More</button></nav>
<script>
const content=document.querySelector('#content');const KEY='mytv-mobile-beta-shows';let saved=JSON.parse(localStorage.getItem(KEY)||'[]');
const samples=[{t:'Reacher',s:'Prime Video',d:'Upcoming',g:'Action • Drama'},{t:'The Last of Us',s:'Max',d:'Upcoming',g:'Drama • Sci-Fi'},{t:'One Piece',s:'Crunchyroll',d:'Upcoming',g:'Anime • Adventure'}];
function shell(x){content.innerHTML='<div class="page">'+x+'</div>'}
function home(){shell('<section class="hero"><h1>Never Miss Another Show.</h1><p>Your entertainment calendar, built for your phone.</p></section><div class="stats"><div class="stat"><b>'+saved.length+'</b>Following</div><div class="stat"><b>✓</b>Mobile</div><div class="stat"><b>Beta</b>Test</div></div><h2>Tonight & Coming Up</h2>'+(saved.length?saved.map(card).join(''):'<div class="empty">No shows followed in this phone beta yet.<br>Go to Discover to test Save + Follow.</div>'))}
function card(x){return '<div class="card"><div class="row"><div class="poster">▶</div><div class="meta"><div class="title">'+x.t+'</div><div class="sub">'+x.g+'</div><span class="tag">'+x.d+'</span></div><button class="btn alt" onclick="details(\''+x.t.replaceAll("'","\\'")+'\')">Details</button></div></div>'}
function discover(){shell('<h2 style="margin-top:0">Discover</h2><input id="q" class="search" placeholder="Search shows..." oninput="drawSearch()"><div class="notice">Phone beta: interface and Save + Follow are live. Private TMDB credentials are intentionally not exposed in this public webpage.</div><div id="results"></div>');drawSearch()}
function drawSearch(){let q=(document.querySelector('#q')?.value||'').toLowerCase();let a=samples.filter(x=>!q||x.t.toLowerCase().includes(q));document.querySelector('#results').innerHTML=a.map(x=>{let on=saved.some(y=>y.t===x.t);return '<div class="card"><div class="row"><div class="poster">★</div><div class="meta"><div class="title">'+x.t+'</div><div class="sub">'+x.s+'<br>'+x.g+'</div></div><button class="btn" onclick="toggle(\''+x.t.replaceAll("'","\\'")+'\')">'+(on?'✓ Following':'Save + Follow')+'</button></div></div>'}).join('')}
function toggle(t){let x=samples.find(z=>z.t===t);let i=saved.findIndex(z=>z.t===t);if(i>=0)saved.splice(i,1);else saved.push(x);localStorage.setItem(KEY,JSON.stringify(saved));drawSearch()}
function shows(){shell('<div class="sectionTitle"><h2 style="margin:0">My Shows</h2><span class="small">'+saved.length+' followed</span></div>'+(saved.length?saved.map(card).join(''):'<div class="empty">Your followed shows will appear here.</div>'))}
function calendar(){shell('<h2 style="margin-top:0">My Calendar</h2>'+(saved.length?saved.map(x=>'<div class="card"><div class="title">'+x.t+'</div><div class="sub">'+x.d+' • '+x.s+'</div></div>').join(''):'<div class="empty">Follow shows to build your calendar.</div>'))}
function more(){shell('<h2 style="margin-top:0">More</h2><div class="card" onclick="catchup()" style="cursor:pointer"><div class="title">✓ Catch Up</div><div class="sub">See aired episodes and keep your progress in one place.</div></div><div class="card" onclick="buildNight()" style="cursor:pointer"><div class="title">★ Build My Night</div><div class="sub">Build a watch plan from episodes you follow and the time you have.</div></div><div class="card"><div class="title">Live Connections</div><div class="sub">TVmaze • TMDB/JustWatch • Google email are connected in your Windows build. Private credentials are not copied into this public beta.</div></div>')}
async function catchup(){shell('<h2 style="margin-top:0">Catch Up</h2><div class="sub" style="margin-bottom:18px">See aired episodes and keep your progress in one place.</div><div id="catch"><div class="empty">Loading aired episodes…</div></div>');let host=document.querySelector('#catch');if(!saved.length){host.innerHTML='<div class="empty">Follow shows first to build Catch Up.</div>';return}let out='';for(const sh of saved){try{let q=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(sh.t));if(!q.ok)continue;let show=await q.json();let r=await fetch('https://api.tvmaze.com/shows/'+show.id+'/episodes');let eps=await r.json();let today=new Date().toISOString().slice(0,10);let aired=eps.filter(e=>e.airdate&&e.airdate<=today).slice(-5).reverse();let watched=JSON.parse(localStorage.getItem('mytv-watched-'+show.id)||'[]');let n=aired.filter(e=>!watched.includes(e.id)).length;out+='<div class="card"><div class="sectionTitle"><div class="title">'+show.name+'</div><span style="color:#ff5f87;font-weight:800;font-size:12px">'+n+' aired episode(s) not marked watched</span></div>';for(const e of aired){let ck=watched.includes(e.id)?'checked':'';out+='<label class="row" style="margin-top:14px;align-items:flex-start"><input type="checkbox" '+ck+' onchange="watchEp('+show.id+','+e.id+',this.checked)" style="width:20px;height:20px"><div class="meta"><div>S'+e.season+'E'+e.number+' • '+(e.name||'Episode')+'</div></div><div class="small">'+e.airdate+'</div></label>'}out+='</div>'}catch(e){out+='<div class="card"><div class="title">'+sh.t+'</div><div class="sub">Could not load episode data right now.</div></div>'}}host.innerHTML=out||'<div class="empty">No aired episodes found.</div>'}
function watchEp(showId,epId,on){let k='mytv-watched-'+showId,a=JSON.parse(localStorage.getItem(k)||'[]');if(on&&!a.includes(epId))a.push(epId);if(!on)a=a.filter(x=>x!==epId);localStorage.setItem(k,JSON.stringify(a));catchup()}
async function buildNight(){shell('<h2 style="margin-top:0">Build My Night</h2><div class="sub" style="margin-bottom:14px">Build a watch plan from episodes you follow and the time you have.</div><div class="card"><div class="title">How much time do you have tonight?</div><select id="budget" class="search" style="margin-top:10px"><option>30</option><option>45</option><option>60</option><option>90</option><option selected>120</option><option>150</option><option>180</option><option>240</option></select><button class="btn" style="margin-top:10px" onclick="makePlan()">Build My Night</button></div><div id="plan"></div>')}
async function makePlan(){let budget=+document.querySelector('#budget').value,candidates=[];for(const sh of saved){try{let q=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(sh.t));if(!q.ok)continue;let show=await q.json();let r=await fetch('https://api.tvmaze.com/shows/'+show.id+'/episodes'),eps=await r.json(),today=new Date().toISOString().slice(0,10),watched=JSON.parse(localStorage.getItem('mytv-watched-'+show.id)||'[]');eps.filter(e=>e.airdate&&e.airdate<=today&&!watched.includes(e.id)).forEach(e=>candidates.push([e.airdate,show,e,e.runtime||show.runtime||45]))}catch(e){}}candidates.sort((a,b)=>b[0].localeCompare(a[0]));let used=0,p=[];for(const x of candidates){if(used+x[3]<=budget){p.push(x);used+=x[3]}}document.querySelector('#plan').innerHTML=p.length?'<h2>Tonight plan • about '+used+' of '+budget+' minutes</h2>'+p.map(x=>'<div class="card"><div class="title">'+x[1].name+'</div><div class="sub">S'+x[2].season+'E'+x[2].number+' • '+(x[2].name||'Episode')+' • ~'+x[3]+' min</div></div>').join(''):'<div class="empty">Nothing currently fits this time window from your unmarked aired episodes.</div>'}
function details(t){let x=[...saved,...samples].find(z=>z.t===t);shell('<button class="btn alt" onclick="shows()">← Back</button><div class="card" style="margin-top:16px"><div class="poster" style="width:100%;height:220px;font-size:55px">▶</div><h2>'+x.t+'</h2><div class="sub">'+x.g+'<br>'+x.s+'</div><h2>Where to Watch</h2><div class="notice">Live provider lookup is protected in the Windows build. A secure backend is required before enabling private API-backed provider lookup on this public phone beta.</div></div>')}
function go(p){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.p===p));({home,discover,shows,calendar,more}[p])()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.p));home();
</script><script>
const REALKEY='mytv-mobile-real-v2';
let realSaved=JSON.parse(localStorage.getItem(REALKEY)||'[]');
function rsave(){localStorage.setItem(REALKEY,JSON.stringify(realSaved))}
function labelDate(d){if(!d)return 'Upcoming';const today=new Date().toISOString().slice(0,10);if(d===today)return 'Tonight';if(d<today)return 'Aired';return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long'})}
function realCard(x){return '<div class="card"><div class="row">'+(x.image?'<img src="'+x.image+'" style="width:62px;height:86px;object-fit:cover;border-radius:12px">':'<div class="poster">▶</div>')+'<div class="meta"><div class="title">'+x.name+'</div><div class="sub">'+(x.nextName||'No next episode announced')+'</div><span class="tag">'+labelDate(x.airdate)+'</span></div><button class="btn alt" onclick="realDetails('+x.id+')">Details</button></div></div>'}
async function refreshReal(x){try{const r=await fetch('https://api.tvmaze.com/shows/'+x.id+'?embed=nextepisode'),j=await r.json(),e=j._embedded&&j._embedded.nextepisode;x.name=j.name;x.image=j.image&&j.image.medium||x.image;x.network=j.webChannel&&j.webChannel.name||j.network&&j.network.name||'';x.status=j.status||'';x.airdate=e&&e.airdate||'';x.airtime=e&&e.airtime||'';x.nextName=e?('S'+e.season+'E'+e.number+' • '+e.name):'No next episode announced';rsave()}catch(e){}return x}
async function home(){for(const x of realSaved)await refreshReal(x);shell('<section class="hero"><h1>Never Miss Another Show.</h1><p>Your real entertainment calendar, live on your phone.</p></section><div class="stats"><div class="stat"><b>'+realSaved.length+'</b>Following</div><div class="stat"><b>LIVE</b>TV Data</div><div class="stat"><b>✓</b>Saved</div></div><h2>Tonight & Coming Up</h2>'+(realSaved.length?realSaved.map(realCard).join(''):'<div class="empty">No shows followed yet.<br>Use Discover to search live TV shows.</div>'))}
function discover(){shell('<h2 style="margin-top:0">Discover</h2><div class="sub" style="margin-bottom:14px">Search live TV data. Saved shows become part of My Shows, Calendar, Catch Up and Build My Night.</div><input id="q" class="search" placeholder="Search real TV shows..." onkeydown="if(event.key===\'Enter\')realSearch()"><button class="btn" style="margin-top:10px;width:100%" onclick="realSearch()">Search</button><div id="results"></div>')}
async function realSearch(){const q=document.querySelector('#q').value.trim(),box=document.querySelector('#results');if(!q)return;box.innerHTML='<div class="empty">Searching live TV data…</div>';try{const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)),a=await r.json();box.innerHTML=a.slice(0,12).map(z=>{const x=z.show,on=realSaved.some(y=>y.id===x.id),img=x.image&&x.image.medium;return '<div class="card"><div class="row">'+(img?'<img src="'+img+'" style="width:62px;height:86px;object-fit:cover;border-radius:12px">':'<div class="poster">★</div>')+'<div class="meta"><div class="title">'+x.name+'</div><div class="sub">'+((x.webChannel&&x.webChannel.name)||(x.network&&x.network.name)||'Network not listed')+' • '+(x.status||'')+'</div></div><button class="btn" onclick="realFollow('+x.id+')">'+(on?'✓ Saved':'Save + Follow')+'</button></div></div>'}).join('')||'<div class="empty">No shows found.</div>'}catch(e){box.innerHTML='<div class="notice">Live search could not load. Check your connection and try again.</div>'}}
async function realFollow(id){if(realSaved.some(x=>x.id===id)){realSaved=realSaved.filter(x=>x.id!==id);rsave();realSearch();return}try{const r=await fetch('https://api.tvmaze.com/shows/'+id+'?embed=nextepisode'),j=await r.json(),e=j._embedded&&j._embedded.nextepisode;realSaved.push({id:j.id,name:j.name,image:j.image&&j.image.medium||'',network:j.webChannel&&j.webChannel.name||j.network&&j.network.name||'',status:j.status||'',airdate:e&&e.airdate||'',airtime:e&&e.airtime||'',nextName:e?('S'+e.season+'E'+e.number+' • '+e.name):'No next episode announced'});rsave();realSearch()}catch(e){alert('This show could not be saved right now.')}}
function shows(){shell('<div class="sectionTitle"><h2 style="margin:0">My Shows</h2><span class="small">'+realSaved.length+' followed</span></div>'+(realSaved.length?realSaved.map(realCard).join(''):'<div class="empty">Use Discover to follow real shows.</div>'))}
function calendar(){const a=[...realSaved].sort((x,y)=>(x.airdate||'9999').localeCompare(y.airdate||'9999'));shell('<h2 style="margin-top:0">My Calendar</h2><div class="sub" style="margin-bottom:14px">Upcoming episodes from the shows you follow.</div>'+(a.length?a.map(realCard).join(''):'<div class="empty">Follow shows to build your calendar.</div>'))}
async function realDetails(id){let x=realSaved.find(z=>z.id===id);if(!x)return;await refreshReal(x);shell('<button class="btn alt" onclick="shows()">← Back</button><div class="card" style="margin-top:16px">'+(x.image?'<img src="'+x.image+'" style="width:145px;border-radius:14px">':'')+'<h2>'+x.name+'</h2><div class="sub">'+(x.network||'Network not listed')+' • '+x.status+'</div><h2>Next Episode</h2><div>'+labelDate(x.airdate)+(x.airtime?' • '+x.airtime:'')+'</div><div class="sub">'+x.nextName+'</div><h2>Tracking</h2><div class="tag">Following</div><div class="notice" style="margin-top:14px">Where to Watch requires the protected TMDB connection. Live TV schedule and episode tracking are active now.</div></div>')}
async function catchup(){shell('<h2 style="margin-top:0">Catch Up</h2><div class="sub" style="margin-bottom:18px">See aired episodes and keep your progress in one place.</div><div id="catch"><div class="empty">Loading aired episodes…</div></div>');let out='';for(const sh of realSaved){try{let r=await fetch('https://api.tvmaze.com/shows/'+sh.id+'/episodes'),eps=await r.json(),today=new Date().toISOString().slice(0,10),aired=eps.filter(e=>e.airdate&&e.airdate<=today).slice(-5).reverse(),watched=JSON.parse(localStorage.getItem('mytv-watched-'+sh.id)||'[]'),n=eps.filter(e=>e.airdate&&e.airdate<=today&&!watched.includes(e.id)).length;out+='<div class="card"><div class="sectionTitle"><div class="title">'+sh.name+'</div><span style="color:#ff5f87;font-weight:800;font-size:12px">'+n+' aired episode(s)<br>not marked watched</span></div>'+aired.map(e=>'<label class="row" style="margin-top:14px;align-items:flex-start"><input type="checkbox" '+(watched.includes(e.id)?'checked':'')+' onchange="watchEp('+sh.id+','+e.id+',this.checked)" style="width:20px;height:20px"><div class="meta">S'+e.season+'E'+e.number+' • '+(e.name||'Episode')+'</div><div class="small">'+e.airdate+'</div></label>').join('')+'</div>'}catch(e){}}document.querySelector('#catch').innerHTML=out||'<div class="empty">Follow shows first to build Catch Up.</div>'}
saved=realSaved.map(x=>({t:x.name}));home();
</script></body></html>
